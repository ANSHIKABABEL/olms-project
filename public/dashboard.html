<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OLMS - Dashboard</title>
  <style>
    body { font-family: Arial; max-width:800px; margin:40px auto; }
    nav { margin-bottom:20px; }
    nav a { margin-right:15px; text-decoration:none; color:blue; }
    table { width:100%; border-collapse: collapse; margin-top:20px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:left; }
    th { background:#eee; }
    .flagged { color:red; font-weight:bold; }
    .pending { background:yellow; }
    .approved { background:lightgreen; }
    .rejected { background:lightcoral; }
    button { padding:4px 8px; margin-right:4px; }
    #modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
             background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
    #modalContent { background:#fff; padding:20px; border-radius:5px; max-width:400px; width:90%; }
    #modalContent input, #modalContent textarea { width:100%; margin-bottom:10px; padding:6px; }
  </style>
</head>
<body>
  <nav>
    <span id="welcome"></span>
    <a href="/index.html" id="applyLink">Apply Leave</a>
    <a href="#" id="logout">Logout</a>
  </nav>

  <h1>Leave Dashboard</h1>
  <table id="leavesTable">
    <thead>
      <tr>
        <th>Employee Name</th>
        <th>Employee ID</th>
        <th>From</th>
        <th>To</th>
        <th>Reason</th>
        <th>Status</th>
        <th>Flagged</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="8">Loading...</td></tr>
    </tbody>
  </table>

  <!-- Modify Modal -->
  <div id="modal">
    <div id="modalContent">
      <h3>Modify Leave</h3>
      <label>From Date:</label>
      <input type="date" id="modalFromDate">
      <label>To Date:</label>
      <input type="date" id="modalToDate">
      <label>Reason:</label>
      <textarea id="modalReason" rows="3"></textarea>
      <button id="modalSave">Save</button>
      <button id="modalCancel">Cancel</button>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    const employeeId = localStorage.getItem('employeeId'); // store employeeId in localStorage
    const name = localStorage.getItem('name');
    const tableBody = document.querySelector('#leavesTable tbody');
    const welcome = document.getElementById('welcome');
    const logoutBtn = document.getElementById('logout');
    const modal = document.getElementById('modal');
    const modalFromDate = document.getElementById('modalFromDate');
    const modalToDate = document.getElementById('modalToDate');
    const modalReason = document.getElementById('modalReason');
    const modalSave = document.getElementById('modalSave');
    const modalCancel = document.getElementById('modalCancel');
    let currentModifyId = null;

    if(!token) window.location.href = '/login.html';
    welcome.textContent = `Welcome, ${name} (${role})`;

    logoutBtn.addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '/login.html';
    });

    async function loadLeaves(){
      let url = '/api/leaves';
      if(role === 'employee') url += `?employeeId=${employeeId}`;

      try {
        const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
        const leaves = await res.json();

        tableBody.innerHTML = leaves.map(l => {
          let actions = '';
          if(role === 'employee' && l.status==='pending'){
            actions = `<button onclick="openModifyModal('${l._id}', '${l.fromDate}', '${l.toDate}', '${l.reason}')">Modify</button>
                       <button onclick="deleteLeave('${l._id}')">Delete</button>`;
          } else if(role==='admin' && l.status==='pending'){
            actions = `<button onclick="approveLeave('${l._id}', 'approved')">Approve</button>
                       <button onclick="approveLeave('${l._id}', 'rejected')">Reject</button>`;
          }
          return `<tr class="${l.status}">
            <td>${l.name}</td>
            <td>${l.employeeId}</td>
            <td>${new Date(l.fromDate).toLocaleDateString()}</td>
            <td>${new Date(l.toDate).toLocaleDateString()}</td>
            <td>${l.reason}</td>
            <td>${l.status}</td>
            <td class="${l.flagged?'flagged':''}">${l.flagged?'⚠️':''}</td>
            <td>${actions}</td>
          </tr>`;
        }).join('');
      } catch(err){
        console.error(err);
        tableBody.innerHTML = '<tr><td colspan="8">Error loading leaves.</td></tr>';
      }
    }

    async function deleteLeave(id){
      if(!confirm('Are you sure you want to delete this leave?')) return;
      await fetch(`/api/leaves/${id}`, { method:'DELETE', headers:{ 'Authorization':'Bearer ' + token } });
      loadLeaves();
    }

    async function approveLeave(id, status){
      await fetch(`/api/leaves/${id}/approve`, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
        body: JSON.stringify({status})
      });
      loadLeaves();
    }

    // Open Modify Modal
    function openModifyModal(id, fromDate, toDate, reason){
      currentModifyId = id;
      modalFromDate.value = fromDate.split('T')[0];
      modalToDate.value = toDate.split('T')[0];
      modalReason.value = reason;
      modal.style.display = 'flex';
    }

    // Save modifications
    modalSave.addEventListener('click', async () => {
      if(!currentModifyId) return;
      const data = {
        fromDate: modalFromDate.value,
        toDate: modalToDate.value,
        reason: modalReason.value
      };
      await fetch(`/api/leaves/${currentModifyId}`, {
        method:'PUT',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+token },
        body: JSON.stringify(data)
      });
      modal.style.display = 'none';
      currentModifyId = null;
      loadLeaves();
    });

    modalCancel.addEventListener('click', () => {
      modal.style.display = 'none';
      currentModifyId = null;
    });

    loadLeaves();
  </script>
</body>
</html>
