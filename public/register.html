<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLMS - Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,  #f9d1d1, #d7e9f7, #f1f0c0);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  .register-container {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    width: 850px;
    height: 680px;
    background: rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    overflow: hidden;
  }

  /* Left illustration area */
  .left-side {
    flex: 1;
   background: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c') no-repeat center center/cover;
      
  }

  /* Right form area */
  .right-side {
    flex: 1;
    background: rgba(255, 255, 255, 0.55);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 40px 50px;
  }

  .right-side h1 {
    text-align: center;
    color: #333;
    font-weight: 500;
    margin-bottom: 10px;
  }

  .right-side p {
    text-align: center;
    color: #555;
    font-size: 14px;
    margin-bottom: 25px;
  }

  label {
    font-weight: 600;
    color: #333;
    margin-top: 10px;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    margin-top: 5px;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9);
    outline: none;
    transition: 0.3s ease;
    font-size: 14px;
  }

  input:focus, select:focus {
    box-shadow: 0 0 8px rgba(98, 182, 203, 0.4);
    transform: scale(1.02);
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    background: linear-gradient(90deg, #24b1f3, #3bbbf7);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  button:hover {
    background: linear-gradient(90deg,  #24b1f3, #3bbbf7);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
  }

  .message {
    margin-top: 10px;
    font-weight: 500;
    font-size: 14px;
    color: #333;
    text-align: center;
  }

  .link {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #333;
  }

  .link a {
    text-decoration: none;
    color: #007bff;
    font-weight: 600;
  }

  .link a:hover {
    text-decoration: underline;
  }

  @media (max-width: 768px) {
    .register-container {
      flex-direction: column;
      width: 90%;
      height: auto;
    }
    .left-side {
      height: 200px;
    }
  }
</style>
</head>

<body>
  <div class="register-container">
    <div class="left-side"></div>

    <div class="right-side">
      <h1>Create Account</h1>
      <p>Register to access your OLMS dashboard.</p>

      <form id="registerForm">
        <label>Name</label>
        <input name="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Employee ID</label>
        <input name="employeeId" placeholder="Enter your Employee ID" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <label>Role</label>
        <select name="role" required>
          <option value="">Select Role</option>
          <option value="employee">Employee</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit">Register</button>
      </form>

      <div class="message" id="msg"></div>
      <div class="link">Already have an account? <a href="login.html">Login here</a></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>


<script>
const form = document.getElementById('registerForm');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const body = {
    name: form.name.value,
    email: form.email.value,
    employeeId: form.employeeId.value,
    password: form.password.value,
    role: form.role.value
  };
  try{
    const res = await fetch('/api/users/register',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) });
    const data = await res.json();
    msg.textContent = data.message;
    msg.style.color = data.success?'green':'red';
    if(data.success) form.reset();
  } catch(err){ console.error(err); msg.textContent='Error registering user.'; msg.style.color='red'; }
});
</script>
</body>
</html>
