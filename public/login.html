<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLMS - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #f9d1d1, #d7e9f7, #f1f0c0);
    height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .container {
    display: flex;
    width: 900px;
    height: 520px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    backdrop-filter: blur(10px);
  }

  /* Left Image Section */
  .left {
    flex: 1;
    background: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80') no-repeat center center;
    background-size: cover;
  }

  /* Right Login Section */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 50px;
    background: rgba(255, 255, 255, 0.4);
  }

  .right h1 {
    text-align: center;
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
  }

  .right p {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
    font-size: 14px;
  }

  label {
    font-weight: 500;
    color: #333;
    margin-top: 10px;
  }

  input, select {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    border: none;
    border-radius: 8px;
    outline: none;
    transition: all 0.3s;
    background: rgba(255, 255, 255, 0.9);
  }

  input:focus, select:focus {
    box-shadow: 0 0 8px rgba(98, 182, 203, 0.4);
    transform: scale(1.02);
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    background: linear-gradient(90deg, #24b1f3, #3bbbf7);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  button:hover {
    background: linear-gradient(90deg, #24b1f3, #3bbbf7);
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  }

  .message {
    margin-top: 15px;
    font-weight: 500;
    font-size: 14px;
    color: #444;
    text-align: center;
  }

  .link {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    color: #444;
  }

  .link a {
    color: #007bff;
    font-weight: 600;
    text-decoration: none;
  }

  .link a:hover {
    text-decoration: underline;
  }

  @media (max-width: 768px) {
    .container {
      flex-direction: column;
      width: 90%;
      height: auto;
    }

    .left {
      height: 200px;
    }

    .right {
      padding: 30px;
    }
  }
</style>
</head>

<body>
  <div class="container">
    <div class="left"></div>
    <div class="right">
      <h1>Sign In</h1>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <label>Role</label>
        <select name="role" required>
          <option value="">Select Role</option>
          <option value="employee">Employee</option>
          <option value="admin">Admin</option>
        </select>

        <button type="submit">Login</button>
      </form>

      <div class="message" id="msg"></div>
      <div class="link">Don’t have an account? <a href="register.html">Register here</a></div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>
const form = document.getElementById('loginForm');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const body = {
    email: form.email.value.trim(),
    password: form.password.value.trim(),
    role: form.role.value
  };

  try {
    const res = await fetch('/api/users/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    msg.textContent = data.message;
    msg.style.color = data.success ? 'green' : 'red';

    if (data.success) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('role', data.role);
      localStorage.setItem('name', data.name);
      localStorage.setItem('employeeId', data.employeeId || '');

      if (data.role === 'admin') {
        window.location.href = '/admin.html';
      } else {
        window.location.href = '/index.html';
      }
    }
  } catch (err) {
    console.error(err);
    msg.textContent = 'Error logging in.';
    msg.style.color = 'red';
  }
});
</script>
</body>
</html>
